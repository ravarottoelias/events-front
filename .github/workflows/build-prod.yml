name: Build App

on:
  push:
    branches:
      - main # The branch name your are commit the new changes

jobs:
  build:
    name: Build and Push Branch
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
    env:
      VITE_NODE_ENV: ${{ vars.VITE_NODE_ENV }}
      VITE_API_URL_CLIENT: ${{ vars.VITE_API_URL_CLIENT }}
      VITE_API_URL_SERVER: ${{ vars.VITE_API_URL_SERVER }}
      VITE_FRONTEND_URL: ${{ vars.VITE_FRONTEND_URL }}
      VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
    steps:
      - run: |
          echo "Desplegando app en ambiente: ${{ vars.VITE_NODE_ENV }}"
      - name: git-checkout
        uses: actions/checkout@v3

      - name: Install all dependencies
        run: yarn install

      - name: Build
        run: yarn build:csr # The build command of your project

      - name: Push
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: dist-main # The branch name where you want to push the assets
          FOLDER: dist # The directory where your assets are generated
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub will automatically add this - you don't need to bother getting a token
          MESSAGE: 'Build: ({sha}) {msg}' # The commit message